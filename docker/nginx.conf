# Preserve only a numeric port and retain Nginx's normalized effective hostname.
map $http_host $usbcloud_port_suffix {
    default "";
    "~:(?<usbcloud_port>[0-9]{1,5})$" :$usbcloud_port;
}

server {
    listen 8080;
    server_name _;
    root /app/public;
    index index.php;
    charset utf-8;
    client_max_body_size 1m;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param HTTP_HOST $host$usbcloud_port_suffix;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 6000s;
        fastcgi_buffering off;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
